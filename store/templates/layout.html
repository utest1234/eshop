{% load static %}
<!DOCTYPE html>
<html lang="mn" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Цахим худалдааны веб</title>
        <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.ico' %}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        <script>
            (function() {
                var t = localStorage.getItem('eshop-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            })();
        </script>
    </head>
    <body class="d-flex flex-column min-vh-100">
        {% include 'navbar.html' %}
        {% if messages %}
            <div class="position-fixed bottom-0 start-0 p-3" style="z-index: 11">
                {% for message in messages %}
                <div class="toast align-items-center text-bg-primary border-0 show mb-2" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
        <footer class="mt-auto bg-dark text-white text-center py-3">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Цахим дэлгүүр 2024</p></div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/scripts.js' %}"></script>
        <script>
            function toggleTheme() {
                var html = document.documentElement;
                var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('eshop-theme', next);
                updateThemeIcon(next);
            }
            function updateThemeIcon(theme) {
                var btn = document.getElementById('theme-toggle');
                if (!btn) return;
                btn.innerHTML = theme === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
            }
            document.addEventListener('DOMContentLoaded', function() {
                updateThemeIcon(localStorage.getItem('eshop-theme') || 'dark');
            });
        </script>
    </body>
</html>
